<main id="app"></main>
<script>
// MODEL-START
const CROPS=['pszenica','rzepak','ziemniaki'];
const NAME={pszenica:'Pszenica',rzepak:'Rzepak',ziemniaki:'Ziemniaki'};
// y = plon t/ha, pbar = cena referencyjna (tys. zł/t), vr = koszt zmienny /ha, fert = koszt poziomu nawozu /ha,
// Ls = poziom nawozu o maksymalnym plonie przy normalnej pogodzie, k = strata plonu za odchylenie, W = mnożnik plonu wg pogody
const P={
 pszenica:{y:6.0,pbar:0.90,vr:2.2,fert:0.203,Ls:8,k:0.00937,eta:0.9,gam:0.7,sig:0.06,lag:0,W:{N:1,G:1.08,D:0.80,H:0.90}},
 rzepak:{y:3.5,pbar:2.00,vr:2.8,fert:0.168,Ls:10,k:0.006,eta:1.0,gam:0.8,sig:0.09,lag:1,W:{N:1,G:1.12,D:0.75,H:0.60}},
 ziemniaki:{y:26,pbar:0.47,vr:8.0,fert:0.334,Ls:7,k:0.00714,eta:1.6,gam:1.0,sig:0.14,lag:0,W:{N:1,G:1.15,D:0.55,H:0.80}}};
const REC={pszenica:6,rzepak:8,ziemniaki:5};
const SHIFT={N:0,G:1,D:-2,H:-1};            // pogoda przesuwa optymalny poziom nawozu
const ROT={pszenica:0.95,rzepak:0.88,ziemniaki:0.88}; // plon po tej samej uprawie rok po roku
const LMAX=10,FIXED=12,LIVING=20,UNSOWN=0.4,START=80,LAND=30,T=8,RZ_MAX=15,RATE=0.12,BANKR=-50;
const SUBSIDY=0.35,SUB_MIN_HA=5,AID=0.5,INS_RATE={pszenica:0.13,rzepak:0.45,ziemniaki:1.2},INS_COVER=0.5,SD_FINE=0.06,SD_COARSE=0.20;
const WEATHER=['N','N','G','D','N','H','N','N'];
const FERT_IDX=[1,1,1,1.4,1.4,1,1,1], COST_IDX=[1,1,1,1,1,1.12,1.12,1];
const EXTRA=[0,0,5,0,0,0,3,0];               // zdarzenia losowe w gospodarstwie (awaria, wydatki rodziny)
const RZ_MULT=[1,1,1,1,1,0.8,0.8,1];          // cło/ograniczenia eksportu rzepaku w sezonach 6-7
const capL=t=>t>=4?8:10;                      // limit azotu od sezonu 5
const subsidyOn=t=>t>=2;                      // dopłata od sezonu 3
const yfw=(k,L,w)=>Math.max(0,1-P[k].k*(L-(P[k].Ls+SHIFT[w]))**2);
const nz=x=>Number.isFinite(x)?x:0;
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function build(seed,wseq){
  const r=rng(seed), nrm=()=>Math.sqrt(-2*Math.log(r()+1e-12))*Math.cos(2*Math.PI*r());
  const price=[],area=[],fc=[],repF=[],repC=[]; let last={},prevA={};
  CROPS.forEach(k=>{last[k]=P[k].pbar;prevA[k]=1});
  for(let t=0;t<T;t++){
    const z=[nrm(),nrm(),nrm()],zn=[nrm(),nrm(),nrm()];
    const sh={pszenica:P.pszenica.sig*z[0],rzepak:P.rzepak.sig*(0.6*z[0]+0.8*z[1]),ziemniaki:P.ziemniaki.sig*z[2]};
    const a={},used={},pr={},rf={},rc={};
    CROPS.forEach(k=>{const c=P[k];a[k]=Math.min(1.35,Math.max(0.65,1+c.gam*(last[k]/c.pbar-1)))});
    CROPS.forEach((k,i)=>{const c=P[k];used[k]=c.lag?prevA[k]:a[k];
      pr[k]=c.pbar*Math.exp(-c.eta*(used[k]*c.W[wseq[t]]-1)+sh[k])*(k==='rzepak'?RZ_MULT[t]:1);
      rf[k]=a[k]+SD_FINE*zn[i];rc[k]=a[k]+SD_COARSE*zn[i]}); // raport banku o siewach w tym sezonie (z błędem)
    price.push(pr);area.push(used);repF.push(rf);repC.push(rc);last=pr;prevA=a;
    const w=wseq[t],o=['N','G','D','H'].filter(x=>x!==w);
    fc.push(r()<0.6?w:o[Math.floor(r()*3)]);
  }
  return{price,area,fc,repF,repC,w:wseq};
}
const perHa=(k,t,L)=>P[k].vr*COST_IDX[t]+nz(L)*P[k].fert*FERT_IDX[t];
function planCost(t,plan){let c=0,sown=0;CROPS.forEach(k=>{c+=plan.ha[k]*perHa(k,t,plan.L[k]);sown+=plan.ha[k]});
 const idle=UNSOWN*(LAND-sown);return{var:c,fix:FIXED*COST_IDX[t],liv:LIVING,idle,extra:EXTRA[t],sown,total:c+FIXED*COST_IDX[t]+LIVING+idle+EXTRA[t]}}
// st={cash,prev:{ha},pend:{ha,L,rep}}; plan={ha,L}; zwraca rozliczenie sezonu t
function settle(Wd,st,plan,t,insured){
  const w=Wd.w[t],pr=Wd.price[t],c=planCost(t,plan),yld={},rev={},normal={},hv={};
  let revNow=0,normNow=0,harv=0;
  CROPS.forEach(k=>{
    const L=k==='rzepak'?st.pend.L:plan.L[k], ha=k==='rzepak'?st.pend.ha:plan.ha[k];
    const rep=k==='rzepak'?st.pend.rep:Math.min(plan.ha[k],st.prev.ha[k]), share=ha>0?Math.min(1,rep/ha):0, rot=1-(1-ROT[k])*share;
    hv[k]=ha;yld[k]=P[k].y*yfw(k,nz(L),w)*P[k].W[w]*rot;rev[k]=ha*yld[k]*pr[k];revNow+=rev[k];harv+=ha;
    normal[k]=ha*P[k].y*yfw(k,nz(L),'N')*rot*pr[k];normNow+=normal[k]});
  const kinds=CROPS.filter(k=>plan.ha[k]>=SUB_MIN_HA).length;
  const subsidy=subsidyOn(t)&&kinds>=2?SUBSIDY*c.sown:0;
  const prevSown=CROPS.reduce((a,k)=>a+st.prev.ha[k],0);
  const aid=t===4?AID*prevSown:0;                 // pomoc suszowa za sezon 4
  const prem=insured?CROPS.reduce((a,k)=>a+INS_RATE[k]*hv[k],0):0, insPay=insured?INS_COVER*Math.max(0,normNow-revNow):0;
  const interest=RATE*Math.max(0,-st.cash);
  const net=revNow+subsidy+aid+insPay-prem-c.total-interest;
  return{w,pr,c,yld,rev,hv,revNow,subsidy,aid,prem,insPay,interest,net,cash:st.cash+net};
}

// ---------- USTAWIENIA ZBIERANIA DANYCH ----------
const ENDPOINT="https://script.google.com/macros/s/AKfycbyP-3IgdeI3NPCv2XoA-EhyCJAVCfjhFGr99ro9uBjgknVPdRbf5Y4sr2ZpZgGbAA61bA/exec"; // adres aplikacji Google Apps Script (patrz instrukcja). Puste = dane tylko lokalnie (kopiowanie na końcu gry).
const GAME_VERSION='3.0';
const W=build(2026,WEATHER);
const SYM={pszenica:'●',rzepak:'■',ziemniaki:'▲'};
const COL={pszenica:'var(--c-psz)',rzepak:'var(--c-rze)',ziemniaki:'var(--c-zie)'};
const WNAME={N:'normalna',G:'sprzyjająca',D:'susza',H:'grad i burze'};
const WSHORT={G:'sprzyj.',N:'norm.',D:'susza',H:'grad'};
const WDESC={N:'Typowe opady i temperatury. Plony na zwykłym poziomie.',
 G:'Ciepło i regularne deszcze. Plony wyższe niż zwykle, zwłaszcza ziemniaków.',
 D:'Upał i brak deszczu przez wiele tygodni. Ziemniaki, które potrzebują dużo wody, cierpią najbardziej. Dużo nawozu przy suszy się nie opłaca, bo rośliny go nie wykorzystają.',
 H:'Gwałtowne burze i grad niszczą rośliny tuż przed zbiorem. Najbardziej cierpi rzepak.'};
const NEWS=[
 [{tag:'gosp',h:'Dziedziczysz gospodarstwo',t:'30 ha pod Wrocławiem, 80 tys. zł na koncie. Pierwszy rok zdecyduje, czy gospodarstwo utrzymasz.'}],
 [{tag:'pol',h:'Ministerstwo zapowiada dopłaty za różnorodność upraw',t:'Od sezonu 3 gospodarstwa, które siedzą co najmniej dwie uprawy po minimum 5 ha, dostaną 0,35 tys. zł do każdego zasianego hektara.'}],
 [{tag:'gosp',h:'Awaria ciągnika',t:'Naprawa kosztuje 5 tys. zł (doliczona do kosztów tego sezonu).'},{tag:'pol',h:'Dopłaty do różnorodności już obowiązują',t:'Zasiej dwie uprawy po minimum 5 ha, aby dostać 0,35 tys. zł do hektara.'}],
 [{tag:'pol',h:'Zapowiedź limitu azotu',t:'Od sezonu 5 maksymalny poziom nawozu wyniesie 8 (ochrona wód przed azotanami).'}],
 [{tag:'pol',h:'Pomoc po suszy',t:'Rząd wypłaca 0,5 tys. zł za każdy hektar zasiany w poprzednim sezonie. Pieniądze trafią do gotówki po tym sezonie.'},{tag:'pol',h:'Limit azotu obowiązuje',t:'Nie możesz stosować nawozu powyżej poziomu 8.'}],
 [{tag:'pol',h:'Ograniczenia eksportu rzepaku',t:'Ceny rzepaku spadły o około 20% w tym i następnym sezonie. Zasiew rzepaku jest teraz mniej opłacalny.'}],
 [{tag:'gosp',h:'Wydatki rodziny',t:'Remont domu: dodatkowe 3 tys. zł w tym sezonie.'}],
 [{tag:'gosp',h:'Ostatni sezon',t:'Rzepaku się nie sieje, bo przychód wpłynąłby po końcu gry. Liczy się gotówka po tym sezonie.'}]];
// ---------- STAN ----------
let S;
const emptyPlan=()=>({ha:{pszenica:0,rzepak:0,ziemniaki:0},L:{pszenica:null,rzepak:null,ziemniaki:null}});
function fresh(){return{screen:'intro',id:'',info:'dokladna',lot:null,quiz:[null,null,null],t:0,cash:START,plan:emptyPlan(),ins:false,
  prev:{ha:{pszenica:0,rzepak:0,ziemniaki:0}},pend:{ha:0,L:0,rep:0},log:[],t0:0,last:null,over:false,sent:0,endSent:false}}
S=fresh();
// ---------- AUTOZAPIS (odświeżenie strony lub zablokowanie telefonu nie kasuje gry) ----------
const KEY='gospodarstwo_v3';
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function clearSave(){try{localStorage.removeItem(KEY)}catch(e){}}
function loadSaved(){try{const j=localStorage.getItem(KEY);if(!j)return null;const o=JSON.parse(j);return o&&o.screen&&o.screen!=='intro'&&Array.isArray(o.log)?o:null}catch(e){return null}}
const $=s=>document.querySelector(s), app=$('#app');
const f1=x=>nz(x).toFixed(1).replace('.',','), f0=x=>Math.round(nz(x)).toString(), f2=x=>nz(x).toFixed(2).replace('.',',');
const sgn=x=>(nz(x)>=0?'+':'−')+f1(Math.abs(x));
const zlt=p=>f0(p*1000), pct=x=>f0(x*100)+'%';
const cname=k=>`<span style="color:${COL[k]};font-weight:600">${SYM[k]} ${NAME[k]}</span>`;
const sum=o=>CROPS.reduce((a,k)=>a+o[k],0);
// ---------- GRAFIKA ----------
function sceneSVG(w){
 const sky={N:['#8DBFE3','#E3EFF6'],G:['#5FB0EE','#FFF0BF'],D:['#E8A24A','#F8DA8E'],H:['#3F4B5C','#8794A6']}[w];
 const gr={N:['#6C9B4E','#4F7F3A'],G:['#78AA50','#548C3A'],D:['#B79A55','#9B7F43'],H:['#587A4A','#42623A']}[w];
 let o=`<svg viewBox="0 0 360 150" role="img" aria-label="Pogoda: ${WNAME[w]}"><defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${sky[0]}"/><stop offset="1" stop-color="${sky[1]}"/></linearGradient></defs><rect width="360" height="150" fill="url(#sk)"/>`;
 const cloud=(x,y,s,c)=>`<g fill="${c}" transform="translate(${x} ${y}) scale(${s})"><ellipse cx="0" cy="0" rx="26" ry="10"/><ellipse cx="-14" cy="-6" rx="14" ry="10"/><ellipse cx="10" cy="-9" rx="16" ry="12"/></g>`;
 if(w==='N'){o+=`<circle cx="285" cy="38" r="17" fill="#FFF6D0" opacity=".9"/>`+cloud(90,40,1.2,'#fff')+cloud(240,60,1,'#F2F6F9')}

function fieldSVG(plan,prev,t){
 const cols=6,rows=5,tw=52,th=40,g=5,seq=[];
 CROPS.forEach(k=>{for(let i=0;i<plan.ha[k];i++)seq.push({k,i})});
 let o=`<svg class="field" viewBox="0 0 ${cols*tw+(cols-1)*g} ${rows*th+(rows-1)*g}" role="img" aria-label="Mapa pola 30 ha">`;
 for(let n=0;n<cols*rows;n++){const x=(n%cols)*(tw+g),y=Math.floor(n/cols)*(th+g),c=seq[n];
  if(c){const tired=c.i<Math.min(plan.ha[c.k],c.k==='rzepak'?prev.ha.rzepak:prev.ha[c.k]);
   o+=`<rect x="${x}" y="${y}" width="${tw}" height="${th}" rx="5" fill="${COL[c.k]}"/><g stroke="#000" stroke-opacity=".22" stroke-width="2">${[10,20,30].map(d=>`<line x1="${x+5}" y1="${y+d}" x2="${x+tw-5}" y2="${y+d}"/>`).join('')}</g>`;
   o+=`<text x="${x+tw/2}" y="${y+th/2+4}" text-anchor="middle" fill="#fff" fill-opacity=".92">${SYM[c.k]}</text>`;
   if(tired)o+=`<circle cx="${x+tw-9}" cy="${y+9}" r="6" fill="#fff" fill-opacity=".92"/><text x="${x+tw-9}" y="${y+12.5}" text-anchor="middle" fill="#A8461F" style="font-size:10px">!</text>`}
  else o+=`<rect x="${x}" y="${y}" width="${tw}" height="${th}" rx="5" fill="var(--soil)" opacity=".55"/><circle cx="${x+14}" cy="${y+12}" r="1.6" fill="#000" opacity=".25"/><circle cx="${x+34}" cy="${y+26}" r="1.6" fill="#000" opacity=".25"/><circle cx="${x+22}" cy="${y+31}" r="1.6" fill="#000" opacity=".25"/>`}
 return o+'</svg>'}

 CROPS.forEach(k=>{if(S.plan.L[k]===null)S.plan.L[k]=0});
 const r=settle(W,{cash:S.cash,prev:S.prev,pend:S.pend},S.plan,t,S.ins);
 S.cash=r.cash;
 const rep=S.info==='dokladna'?W.repF[t]:W.repC[t];
 const row={sezon:t+1,pogoda:r.w,prognoza:W.fc[t],ha_psz:S.plan.ha.pszenica,ha_rze:S.plan.ha.rzepak,ha_zie:S.plan.ha.ziemniaki,
  naw_psz:S.plan.L.pszenica,naw_rze:S.plan.L.rzepak,naw_zie:S.plan.L.ziemniaki,ubezp:S.ins?1:0,skladka:+r.prem.toFixed(2),wyplata_ubezp:+r.insPay.toFixed(2),
  doplata:+r.subsidy.toFixed(2),pomoc:+r.aid.toFixed(2),raport_psz:+rep.pszenica.toFixed(3),raport_rze:+rep.rzepak.toFixed(3),raport_zie:+rep.ziemniaki.toFixed(3),
  cena_psz:+(r.pr.pszenica*1000).toFixed(0),cena_rze:+(r.pr.rzepak*1000).toFixed(0),cena_zie:+(r.pr.ziemniaki*1000).toFixed(0),
  przychod:+r.revNow.toFixed(2),koszty:+r.c.total.toFixed(2),odsetki:+r.interest.toFixed(2),wynik:+r.net.toFixed(2),gotowka:+S.cash.toFixed(2),czas_s:+secs.toFixed(1)};
 S.log.push(row);
 send({typ:'sezon',kod:S.id,wariant:S.info,wersja:GAME_VERSION,loteria:S.lot===null?null:S.lot+1,quiz:S.quiz.join(''),...row});
 S.last={t,r,ha:{...S.plan.ha},pend:{...S.pend},ins:S.ins};
 const prevRz=S.prev.ha.rzepak;
 S.prev={ha:{...S.plan.ha}};
 S.pend={ha:S.plan.ha.rzepak,L:S.plan.L.rzepak,rep:Math.min(S.plan.ha.rzepak,prevRz)};
 S.over=S.cash<BANKR;S.screen='result';render();}
function result(){
 const {t,r,ha,pend}=S.last,done=S.over||t===T-1,fcOk=W.fc[t]===r.w;
 const lines=[];
 lines.push(`Pogoda: ${WNAME[r.w]}. ${fcOk?'Prognoza się sprawdziła.':'Prognoza się nie sprawdziła ('+WNAME[W.fc[t]]+').'}`);
 if(r.subsidy>0)lines.push(`Dopłata do różnorodności upraw: +${f1(r.subsidy)}.`);else if(subsidyOn(t))lines.push('Dopłaty do różnorodności nie dostałeś: potrzebne są dwie uprawy po minimum 5 ha.');
 if(r.aid>0)lines.push(`Pomoc po suszy: +${f1(r.aid)}.`);
 if(S.last.ins)lines.push(`Ubezpieczenie: składka −${f1(r.prem)}, wypłata +${f1(r.insPay)}.`);
 app.innerHTML=`
 <div class="scene">${sceneSVG(r.w)}<div class="cap"><div><div class="label" style="color:#fff;opacity:.85">Wynik sezonu ${t+1}</div><b>${WNAME[r.w]}</b></div><b class="num" style="color:#fff">${sgn(r.net)}</b></div></div>
 <div class="panel scroll"><table>
  <tr><th>Uprawa</th><th>Zbiór (ha)</th><th>Plon t/ha</th><th>Cena zł/t</th><th>Przychód</th></tr>
  ${CROPS.map(k=>`<tr><td>${cname(k)}${k==='rzepak'?'<br><span class="small muted">z zasiewu z poprzedniego sezonu</span>':''}</td><td class="num">${r.hv[k]}</td><td class="num">${f1(r.yld[k])}</td><td class="num">${zlt(r.pr[k])}</td><td class="num">${f1(r.rev[k])}</td></tr>`).join('')}
  <tr><td colspan="4">Dopłaty i pomoc państwa</td><td class="num pos">+${f1(r.subsidy+r.aid)}</td></tr>
  ${S.last.ins?`<tr><td colspan="4">Ubezpieczenie (wypłata − składka)</td><td class="num ${r.insPay-r.prem>=0?'pos':'neg'}">${sgn(r.insPay-r.prem)}</td></tr>`:''}
  <tr><td colspan="4">Koszty (uprawy, stałe, rodzina, odłóg${EXTRA[t]?', awaria':''})</td><td class="num neg">−${f1(r.c.total)}</td></tr>
  <tr><td colspan="4">Odsetki od zadłużenia</td><td class="num neg">−${f1(r.interest)}</td></tr>
  <tr><td colspan="4"><b>Wynik sezonu</b></td><td class="num ${r.net>=0?'pos':'neg'}"><b>${sgn(r.net)}</b></td></tr>
  <tr><td colspan="4"><b>Gotówka po sezonie (tys. zł)</b></td><td class="num"><b>${f1(S.cash)}</b></td></tr></table>
  <ul class="small" style="margin:0;padding-left:18px">${lines.map(l=>`<li>${l}</li>`).join('')}</ul>
  ${S.over?'<p class="bad">Gotówka spadła poniżej −50 tys. zł. Gospodarstwo upadło, gra kończy się.</p>':''}
  </div>
 <div class="dock"><div><div class="info"><span class="label">Gotówka (tys. zł)</span><b>${f1(S.cash)}</b></div><button id="nx">${done?'Zobacz podsumowanie':'Następny sezon'}</button></div></div>`;
 $('#nx').onclick=()=>{if(done){S.screen='end'}else{S.t++;S.plan=emptyPlan();S.screen='season'}render()};}
function end(){
 const L=S.log;
 const hhi=L.map(x=>{const s=x.ha_psz+x.ha_rze+x.ha_zie||1;return((x.ha_psz/s)**2+(x.ha_rze/s)**2+(x.ha_zie/s)**2)}).reduce((a,b)=>a+b,0)/L.length;
 const dev=L.map(x=>(Math.abs(x.naw_psz-REC.pszenica)*x.ha_psz+Math.abs(x.naw_rze-REC.rzepak)*x.ha_rze+Math.abs(x.naw_zie-REC.ziemniaki)*x.ha_zie)/((x.ha_psz+x.ha_rze+x.ha_zie)||1)).reduce((a,b)=>a+b,0)/L.length;
 const meta={kod:S.id,wariant:S.info,wersja:GAME_VERSION,loteria:S.lot===null?null:S.lot+1,quiz:S.quiz.join(''),upadek:S.over?1:0,gotowka_koncowa:+S.cash.toFixed(2),hhi:+hhi.toFixed(3),sr_odchylenie_nawozu:+dev.toFixed(2),sezony_ubezp:L.filter(x=>x.ubezp).length};
 if(!S.endSent){send({typ:'koniec',...meta});S.endSent=true;save()}
 const hdr=Object.keys(L[0]);
 const csv=[hdr.join(','),...L.map(x=>hdr.map(h=>x[h]).join(','))].join('\n');
 app.innerHTML=`<div class="scene">${sceneSVG(S.cash>=START?'G':'N')}<div class="cap"><div><div class="label" style="color:#fff;opacity:.85">Koniec gry</div><b>Gotówka końcowa: ${f1(S.cash)} tys. zł</b></div></div></div>
 <p class="muted">${S.over?'Gospodarstwo upadło.':'Rozegrałeś wszystkie sezony.'} Start: ${START} tys. zł.</p>
 <div class="panel"><div class="label">Twoje decyzje w skrócie</div>
  <div class="kv"><span>Średnia różnorodność upraw (1 = jedna uprawa, 0,33 = równo trzy)</span><span>${f2(hhi)}</span></div>
  <div class="kv"><span>Średnie odchylenie nawozu od zalecanego (poziomy)</span><span>${f1(dev)}</span></div>
  <div class="kv"><span>Sezony z ubezpieczeniem</span><span>${meta.sezony_ubezp}</span></div></div>
 <div class="panel scroll"><table><tr><th>Sezon</th><th>Pogoda</th><th>Psz./Rze./Zie. (ha)</th><th>Nawóz</th><th>Wynik</th><th>Gotówka</th></tr>
  ${L.map(x=>`<tr><td>${x.sezon}</td><td>${WNAME[x.pogoda]}</td><td class="num">${x.ha_psz}/${x.ha_rze}/${x.ha_zie}</td><td class="num">${x.naw_psz}/${x.naw_rze}/${x.naw_zie}</td><td class="num ${x.wynik>=0?'pos':'neg'}">${sgn(x.wynik)}</td><td class="num">${f1(x.gotowka)}</td></tr>`).join('')}</table></div>
 <div class="panel"><h3>Dane do badania</h3><p class="small muted">${ENDPOINT?'Wyniki zostały wysłane automatycznie. Jeśli prowadząca badanie ich nie widzi, skopiuj poniższy tekst i wklej go w formularzu.':'Skopiuj poniższy tekst i wklej go w formularzu przekazanym przez prowadzącą badanie.'} Zawiera tylko kod uczestnika i decyzje w grze.</p>
  <textarea id="out" readonly>${csv}\n#${JSON.stringify(meta)}</textarea>
  <div class="row"><button id="cp">Skopiuj wyniki</button><span id="cpm" class="small"></span><button class="ghost" id="rs">Zagraj ponownie (tryb pokazowy)</button></div></div>`;
 $('#cp').onclick=()=>{const t=$('#out');t.select();let ok=false;try{navigator.clipboard.writeText(t.value).then(()=>{$('#cpm').textContent='Skopiowano.'},()=>{$('#cpm').textContent='Zaznacz tekst i skopiuj ręcznie.'});ok=true}catch(e){}if(!ok)$('#cpm').textContent='Zaznacz tekst i skopiuj ręcznie.'};
 $('#rs').onclick=()=>{clearSave();S=fresh();render()};}
function render(){({intro,lottery,rules,season,result,end})[S.screen]();window.scrollTo(0,0);save()}
if(location.hash!=='#demo'){const o=loadSaved();if(o){S=Object.assign(fresh(),o);S.t0=Date.now()}}
render();
</script>
