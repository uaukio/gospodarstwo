<title>Gra Gospodarstwo</title>

<style>
[hidden]{display:none!important}
/* Układ: jedna kolumna dla telefonu i laptopa. Scena pogody u góry, gazeta, rynek, mapa pola, uprawy, dolny pasek z kosztem i przyciskiem. */

  --f-display:"Archivo","Arial Narrow",Arial,sans-serif; --f-body:"IBM Plex Sans",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;

  --c-psz:#E8B64A; --c-rze:#8FCB66; --c-zie:#CB9DE0; --soft:#243029; --soil:#6B5D4A; --paper:#26261F; --paper-ink:#ECE8DA; --paper-line:#46443A; color-scheme:dark}}

  --c-psz:#E8B64A; --c-rze:#8FCB66; --c-zie:#CB9DE0; --soft:#243029; --soil:#6B5D4A; --paper:#26261F; --paper-ink:#ECE8DA; --paper-line:#46443A; color-scheme:dark}

.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px} @media(max-width:700px){.grid3{grid-template-columns:1fr}}

/* gazeta */
.paper{padding:0;gap:0;overflow:hidden}

/* wyniki */
.hero{position:relative}.hero .av{position:absolute;left:12px;top:12px;border:3px solid rgba(255,255,255,.9);width:58px;height:58px}
.rc{border:1px solid var(--line);border-left:6px solid var(--c);border-radius:12px;background:var(--surface);padding:12px;display:flex;flex-direction:column;gap:9px}

.pill.p{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}.pill.n{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}.pill.z{background:var(--soft);color:var(--muted)}
.bars{display:grid;grid-template-columns:78px 1fr 48px;gap:4px 8px;align-items:center;font-size:12px}
.bars .tr{height:12px;border-radius:6px;background:var(--soft);overflow:hidden}.bars .tr i{display:block;height:100%;border-radius:6px;background:var(--c)}
.bars .tr i.exp{background:repeating-linear-gradient(135deg,var(--c) 0 5px,transparent 5px 9px);opacity:.55}
.bars .v{font:500 12.5px var(--f-mono);text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip2{display:flex;align-items:center;gap:5px;padding:3px 9px 3px 5px;border-radius:99px;background:var(--soft);font:600 12px var(--f-body)}
.chip2 svg{flex:none}.chip2 b{font-family:var(--f-mono);font-weight:600}
.flow{display:grid;grid-template-columns:120px 1fr 56px;gap:6px 8px;align-items:center;font-size:13px}
.flow .tr{height:16px;position:relative}.flow .tr i{position:absolute;top:0;height:100%;border-radius:4px}
.flow .mid{position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--muted);opacity:.6}
.flow .v{font:500 13px var(--f-mono);text-align:right}
.adv{display:flex;gap:10px;align-items:center;background:var(--soft);border-radius:12px;padding:10px 12px}.adv .av{width:46px;height:46px}.adv p{font-size:13.5px;line-height:1.4}

.meter{display:flex;gap:3px;align-items:flex-end;height:22px}.meter i{flex:1;border-radius:2px;background:var(--line);height:40%}.meter i.on{background:var(--c);height:100%}.meter i.rec{outline:2px solid var(--ink);outline-offset:1px}
.out4 svg{display:block;margin:0 auto}

<main id="app"></main>
<script>
// MODEL-START
const CROPS=['pszenica','rzepak','ziemniaki'];
const NAME={pszenica:'Pszenica',rzepak:'Rzepak',ziemniaki:'Ziemniaki'};
// y = plon t/ha, pbar = cena referencyjna (tys. zł/t), vr = koszt zmienny /ha, fert = koszt poziomu nawozu /ha,
// Ls = poziom nawozu o maksymalnym plonie przy normalnej pogodzie, k = strata plonu za odchylenie, W = mnożnik plonu wg pogody
const P={
 pszenica:{y:6.0,pbar:0.90,vr:2.2,fert:0.203,Ls:8,k:0.00937,eta:0.9,gam:0.7,sig:0.06,lag:0,W:{N:1,G:1.08,D:0.80,H:0.90}},
 rzepak:{y:3.5,pbar:2.00,vr:2.8,fert:0.168,Ls:10,k:0.006,eta:1.0,gam:0.8,sig:0.09,lag:1,W:{N:1,G:1.12,D:0.75,H:0.60}},
 ziemniaki:{y:26,pbar:0.47,vr:8.0,fert:0.334,Ls:7,k:0.00714,eta:1.6,gam:1.0,sig:0.14,lag:0,W:{N:1,G:1.15,D:0.55,H:0.80}}};
const REC={pszenica:6,rzepak:8,ziemniaki:5};
const SHIFT={N:0,G:1,D:-2,H:-1};            // pogoda przesuwa optymalny poziom nawozu
const ROT={pszenica:0.95,rzepak:0.88,ziemniaki:0.88}; // plon po tej samej uprawie rok po roku
const LMAX=10,FIXED=12,LIVING=20,UNSOWN=0.4,START=80,LAND=30,T=8,RZ_MAX=15,RATE=0.12,BANKR=-50;
const SUBSIDY=0.35,SUB_MIN_HA=5,AID=0.5,INS_RATE={pszenica:0.13,rzepak:0.45,ziemniaki:1.2},INS_COVER=0.5,SD_FINE=0.06,SD_COARSE=0.20;
const WEATHER=['N','N','G','D','N','H','N','N'];
const FERT_IDX=[1,1,1,1.4,1.4,1,1,1], COST_IDX=[1,1,1,1,1,1.12,1.12,1];
const EXTRA=[0,0,5,0,0,0,3,0];               // zdarzenia losowe w gospodarstwie (awaria, wydatki rodziny)
const RZ_MULT=[1,1,1,1,1,0.8,0.8,1];          // cło/ograniczenia eksportu rzepaku w sezonach 6-7
const capL=t=>t>=4?8:10;                      // limit azotu od sezonu 5
const subsidyOn=t=>t>=2;                      // dopłata od sezonu 3
const yfw=(k,L,w)=>Math.max(0,1-P[k].k*(L-(P[k].Ls+SHIFT[w]))**2);
const nz=x=>Number.isFinite(x)?x:0;
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function build(seed,wseq){
  const r=rng(seed), nrm=()=>Math.sqrt(-2*Math.log(r()+1e-12))*Math.cos(2*Math.PI*r());
  const price=[],area=[],fc=[],repF=[],repC=[]; let last={},prevA={};
  CROPS.forEach(k=>{last[k]=P[k].pbar;prevA[k]=1});
  for(let t=0;t<T;t++){
    const z=[nrm(),nrm(),nrm()],zn=[nrm(),nrm(),nrm()];
    const sh={pszenica:P.pszenica.sig*z[0],rzepak:P.rzepak.sig*(0.6*z[0]+0.8*z[1]),ziemniaki:P.ziemniaki.sig*z[2]};
    const a={},used={},pr={},rf={},rc={};
    CROPS.forEach(k=>{const c=P[k];a[k]=Math.min(1.35,Math.max(0.65,1+c.gam*(last[k]/c.pbar-1)))});
    CROPS.forEach((k,i)=>{const c=P[k];used[k]=c.lag?prevA[k]:a[k];
      pr[k]=c.pbar*Math.exp(-c.eta*(used[k]*c.W[wseq[t]]-1)+sh[k])*(k==='rzepak'?RZ_MULT[t]:1);
      rf[k]=a[k]+SD_FINE*zn[i];rc[k]=a[k]+SD_COARSE*zn[i]}); // raport banku o siewach w tym sezonie (z błędem)
    price.push(pr);area.push(used);repF.push(rf);repC.push(rc);last=pr;prevA=a;
    const w=wseq[t],o=['N','G','D','H'].filter(x=>x!==w);
    fc.push(r()<0.6?w:o[Math.floor(r()*3)]);
  }
  return{price,area,fc,repF,repC,w:wseq};
}
const perHa=(k,t,L)=>P[k].vr*COST_IDX[t]+nz(L)*P[k].fert*FERT_IDX[t];
function planCost(t,plan){let c=0,sown=0;CROPS.forEach(k=>{c+=plan.ha[k]*perHa(k,t,plan.L[k]);sown+=plan.ha[k]});
 const idle=UNSOWN*(LAND-sown);return{var:c,fix:FIXED*COST_IDX[t],liv:LIVING,idle,extra:EXTRA[t],sown,total:c+FIXED*COST_IDX[t]+LIVING+idle+EXTRA[t]}}
// st={cash,prev:{ha},pend:{ha,L,rep}}; plan={ha,L}; zwraca rozliczenie sezonu t
function settle(Wd,st,plan,t,insured){
  const w=Wd.w[t],pr=Wd.price[t],c=planCost(t,plan),yld={},rev={},normal={},hv={};
  let revNow=0,normNow=0,harv=0;
  CROPS.forEach(k=>{
    const L=k==='rzepak'?st.pend.L:plan.L[k], ha=k==='rzepak'?st.pend.ha:plan.ha[k];
    const rep=k==='rzepak'?st.pend.rep:Math.min(plan.ha[k],st.prev.ha[k]), share=ha>0?Math.min(1,rep/ha):0, rot=1-(1-ROT[k])*share;
    hv[k]=ha;yld[k]=P[k].y*yfw(k,nz(L),w)*P[k].W[w]*rot;rev[k]=ha*yld[k]*pr[k];revNow+=rev[k];harv+=ha;
    normal[k]=ha*P[k].y*yfw(k,nz(L),'N')*rot*pr[k];normNow+=normal[k]});
  const kinds=CROPS.filter(k=>plan.ha[k]>=SUB_MIN_HA).length;
  const subsidy=subsidyOn(t)&&kinds>=2?SUBSIDY*c.sown:0;
  const prevSown=CROPS.reduce((a,k)=>a+st.prev.ha[k],0);
  const aid=t===4?AID*prevSown:0;                 // pomoc suszowa za sezon 4
  const prem=insured?CROPS.reduce((a,k)=>a+INS_RATE[k]*hv[k],0):0, insPay=insured?INS_COVER*Math.max(0,normNow-revNow):0;

   $('#mx-'+k).textContent=k==='rzepak'&&t===T-1?'W ostatnim sezonie nie sieje się rzepaku.':`Możesz zasiać do ${allowed} ha`+(k==='rzepak'?' (limit '+RZ_MAX+' ha, zapłata za rok)':'')+'.';
   const L=S.plan.L[k],has=L!==null;
   $('#lv-'+k).textContent=has?String(L):'nie wybrano';
   $('#mt-'+k).innerHTML=[...Array(maxL).keys()].map(i=>`<i class="${has&&i<L?'on':''} ${i+1===REC[k]?'rec':''}"></i>`).join('');
   $('#pc-'+k).textContent=has?f1(perHa(k,t,L))+' tys. zł':'—';
   $('#o4-'+k).innerHTML=has?['G','N','D','H'].map(w=>{const v=P[k].W[w]*yfw(k,L,w)*100;return`<div>${wIcon(w,26)}<b class="${v>=100?'pos':v<70?'neg':''}">${f0(v)}%</b></div>`}).join(''):'<p class="small muted" style="grid-column:1/-1">Wybierz poziom nawozu, aby zobaczyć plon.</p>'});
  const c=planCost(t,S.plan);
  $('#map').innerHTML=fieldSVG(S.plan,S.prev,t);
  $('#cost').textContent=f1(c.total+(S.ins?premium():0));$('#land').textContent=(LAND-c.sown)+' ha';$('#prem').textContent=f1(premium());
  $('#c1').textContent=f1(c.var);$('#c2').textContent=f1(c.fix);$('#c3').textContent=f1(c.liv);$('#c4').textContent=f1(c.idle);
  const miss=CROPS.filter(k=>S.plan.ha[k]>0&&S.plan.L[k]===null);
  $('#warn').textContent=miss.length?'Wybierz poziom nawozu dla: '+miss.map(k=>NAME[k]).join(', ')+'.':'';
  $('#ok').disabled=miss.length>0;save();}
 upd();window.scrollTo(0,0);S.t0=Date.now();}
function send(payload){ if(!ENDPOINT)return; try{fetch(ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)}).then(()=>{S.sent++},()=>{})}catch(e){} }
function commit(){
 const t=S.t,secs=(Date.now()-S.t0)/1000;
 CROPS.forEach(k=>{if(S.plan.L[k]===null)S.plan.L[k]=0});
 const r=settle(W,{cash:S.cash,prev:S.prev,pend:S.pend},S.plan,t,S.ins);
 S.cash=r.cash;
 const rep=S.info==='dokladna'?W.repF[t]:W.repC[t];
 const row={sezon:t+1,pogoda:r.w,prognoza:W.fc[t],ha_psz:S.plan.ha.pszenica,ha_rze:S.plan.ha.rzepak,ha_zie:S.plan.ha.ziemniaki,
  naw_psz:S.plan.L.pszenica,naw_rze:S.plan.L.rzepak,naw_zie:S.plan.L.ziemniaki,ubezp:S.ins?1:0,skladka:+r.prem.toFixed(2),wyplata_ubezp:+r.insPay.toFixed(2),
  doplata:+r.subsidy.toFixed(2),pomoc:+r.aid.toFixed(2),raport_psz:+rep.pszenica.toFixed(3),raport_rze:+rep.rzepak.toFixed(3),raport_zie:+rep.ziemniaki.toFixed(3),
  cena_psz:+(r.pr.pszenica*1000).toFixed(0),cena_rze:+(r.pr.rzepak*1000).toFixed(0),cena_zie:+(r.pr.ziemniaki*1000).toFixed(0),
  przychod:+r.revNow.toFixed(2),koszty:+r.c.total.toFixed(2),odsetki:+r.interest.toFixed(2),wynik:+r.net.toFixed(2),gotowka:+S.cash.toFixed(2),czas_s:+secs.toFixed(1)};
 S.log.push(row);
 send({typ:'sezon',kod:S.id,wariant:S.info,wersja:GAME_VERSION,loteria:S.lot===null?null:S.lot+1,quiz:S.quiz.join(''),...row});
 S.last={t,r,ha:{...S.plan.ha},L:{...S.plan.L},pend:{...S.pend},prevHa:{...S.prev.ha},ins:S.ins};
 const prevRz=S.prev.ha.rzepak;
 S.prev={ha:{...S.plan.ha}};
 S.pend={ha:S.plan.ha.rzepak,L:S.plan.L.rzepak,rep:Math.min(S.plan.ha.rzepak,prevRz)};
 S.over=S.cash<BANKR;S.screen='result';render();}
function cropRep(k){
 const {t,r,ha,L,pend,prevHa}=S.last,hv=r.hv[k];if(!hv)return null;
 const sowT=k==='rzepak'?t-1:t,Lk=nz(k==='rzepak'?pend.L:(L||{})[k]);
 const rep=k==='rzepak'?pend.rep:Math.min(ha[k],(prevHa||{})[k]||0),share=Math.min(1,rep/hv),rot=1-(1-ROT[k])*share;
 const yn=P[k].y*yfw(k,Lk,'N')*rot,pe=lastP(k,sowT),exp=hv*yn*pe,act=r.rev[k],cost=hv*perHa(k,Math.max(0,sowT),Lk);
 const effW=P[k].W[r.w]-1,effF=yfw(k,Lk,r.w)/Math.max(1e-9,yfw(k,Lk,'N'))-1,effP=r.pr[k]/pe-1;
 return{k,hv,exp,act,cost,effW,effF,effP,rotLoss:share*(1-ROT[k]),ey:(1+effW)*(1+effF)-1,tot:exp>0?act/exp-1:0}}
const chip=(ic,label,v)=>{const p=v*100;if(Math.abs(p)<1)return `<span class="chip2">${ic}<span>${label}</span><b class="muted">0%</b></span>`;return `<span class="chip2">${ic}<span>${label}</span><b class="${p>0?'pos':'neg'}">${p>0?'+':'−'}${f0(Math.abs(p))}%</b></span>`};
function result(){
 const {t,r,ha,pend}=S.last,done=S.over||t===T-1,fcOk=W.fc[t]===r.w,reps=CROPS.map(cropRep).filter(Boolean);
 const mx=Math.max(1,...reps.map(x=>Math.max(x.exp,x.act)));
 const cards=reps.map(x=>{const cls=x.tot>=0.03?'p':x.tot<=-0.03?'n':'z',lbl=x.tot>=0.03?`▲ +${f0(x.tot*100)}%`:x.tot<=-0.03?`▼ −${f0(-x.tot*100)}%`:'≈ 0%';
  return `<div class="rc" style="--c:${COL[x.k]}"><div class="hd">${cropIcon(x.k,38)}<div><b>${NAME[x.k]}</b><div class="small muted">${x.hv} ha${x.k==='rzepak'?' · zasiew z poprzedniego sezonu':''}</div></div><span class="pill ${cls}">${lbl}</span></div>
   <div class="bars"><span>Oczekiwano</span><div class="tr"><i class="exp" style="width:${x.exp/mx*100}%"></i></div><span class="v">${f1(x.exp)}</span>
    <span>Faktycznie</span><div class="tr"><i style="width:${x.act/mx*100}%"></i></div><span class="v"><b>${f1(x.act)}</b></span></div>
   <div class="chips">${chip(wIcon(r.w,20),'Pogoda',x.effW)}${chip(bagIcon(18),'Nawóz do pogody',x.effF)}${chip(icoSVG('coin',18),'Cena',x.effP)}${x.rotLoss>0?chip(`<svg width="18" height="18" viewBox="0 0 48 48">${ICO.rot}</svg>`,'Ta sama uprawa',-x.rotLoss):''}</div>
   <div class="kv"><span>Zysk z uprawy (przychód − koszty${x.k==='rzepak'?' z zeszłego sezonu':''})</span><span class="${x.act-x.cost>=0?'pos':'neg'}">${sgn(x.act-x.cost)} (${x.cost>0?(x.act-x.cost>=0?'+':'−')+f0(Math.abs((x.act-x.cost)/x.cost*100))+'%':'—'})</span></div></div>`}).join('');
 const rows=[['Przychód z upraw',r.revNow],['Dopłaty i pomoc',r.subsidy+r.aid],...(S.last.ins?[['Ubezpieczenie',r.insPay-r.prem]]:[]),['Koszty gospodarstwa',-r.c.total],...(r.interest>0?[['Odsetki',-r.interest]]:[])];
 const m=Math.max(1,...rows.map(x=>Math.abs(x[1])),Math.abs(r.net));
 const bar=v=>`<div class="tr"><span class="mid"></span><i style="${v>=0?`left:50%;width:${Math.abs(v)/m*50}%;background:var(--good)`:`right:50%;width:${Math.abs(v)/m*50}%;background:var(--bad)`}"></i></div>`;
 const pendEst=S.pend.ha*P.rzepak.y*yfw('rzepak',nz(S.pend.L),'N')*r.pr.rzepak;
 let adv='';
 if(reps.length){const dlt=x=>x.act-x.exp,worst=reps.reduce((a,b)=>dlt(b)<dlt(a)?b:a),best=reps.reduce((a,b)=>dlt(b)>dlt(a)?b:a),m2=[];
  if(dlt(worst)<-2){const byY=worst.ey<=worst.effP;m2.push(`Najwięcej straciłeś na: <b>${NAME[worst.k]}</b> (${f0(dlt(worst))} tys.). ${byY?`Plon był o ${f0(-worst.ey*100)}% niższy niż w normalnym roku (${WNAME[r.w]}${worst.effF<-0.03?', nawóz nie pasował do pogody':''}).`:`Cena spadła o ${f0(-worst.effP*100)}% względem poprzedniego sezonu.`}`)}
  if(dlt(best)>2)m2.push(`Najwięcej zyskałeś na: <b>${NAME[best.k]}</b> (+${f0(dlt(best))} tys. ponad oczekiwania).`);
  if(r.net<0&&S.pend.ha>0&&t<T-1)m2.push('Część nakładów (rzepak) zwróci się dopiero za rok, dlatego ten sezon wygląda gorzej.');
  adv=m2.join('<br>')}
 const sub=subsidyOn(t)&&r.subsidy===0?'<span class="small muted">Dopłaty do różnorodności nie dostałeś: potrzebne są dwie uprawy po minimum 5 ha.</span>':'';
 app.innerHTML=`
 <div class="scene">${sceneSVG(r.w)}<div class="cap"><div><div class="label" style="color:#fff;opacity:.9">Wynik sezonu ${t+1} · pogoda: ${WNAME[r.w]}</div><b>${fcOk?'Prognoza się sprawdziła':'Prognoza się pomyliła ('+WNAME[W.fc[t]]+')'}</b></div><b class="num" style="color:#fff;font-size:26px">${sgn(r.net)}</b></div></div>
 ${adv?`<div class="adv"><div class="av">${farmerSVG(moodOf(r.net),46)}</div><p>${adv}</p></div>`:''}
 <div class="label">Oczekiwania a rzeczywistość (przychód w tys. zł)</div>
 ${cards||'<p class="muted">W tym sezonie nic nie zbierałeś.</p>'}
 <div class="panel"><div class="label">Skąd wzięły się pieniądze (tys. zł)</div><div class="flow">
  ${rows.map(x=>`<span>${x[0]}</span>${bar(x[1])}<span class="v ${x[1]>=0?'pos':'neg'}">${sgn(x[1])}</span>`).join('')}
  <span><b>Wynik sezonu</b></span>${bar(r.net)}<span class="v ${r.net>=0?'pos':'neg'}"><b>${sgn(r.net)}</b></span></div>
  <div class="kv"><span><b>Gotówka po sezonie</b></span><span><b>${f1(S.cash)}</b></span></div>${sub}
  ${S.over?'<p class="bad">Gotówka spadła poniżej −50 tys. zł. Gospodarstwo upadło, gra kończy się.</p>':''}</div>
 ${S.pend.ha>0&&!done?`<div class="pending">${cropIcon('rzepak',38)}<p><b>Rzepak w drodze: ${S.pend.ha} ha</b><br>Zapłata wpłynie dopiero w następnym sezonie i <b>nie jest</b> wliczona do gotówki teraz. Szacunek przy normalnej pogodzie i dzisiejszej cenie: <b class="num">ok. +${f0(pendEst)} tys. zł</b>.</p></div>`:''}
 <div class="dock"><div><div class="info"><span class="label">Gotówka (tys. zł)</span><b>${f1(S.cash)}</b></div><button id="nx">${done?'Zobacz podsumowanie':'Następny sezon'}</button></div></div>`;
 $('#nx').onclick=()=>{if(done){S.screen='end'}else{S.t++;S.plan=emptyPlan();S.screen='season'}render()};}
function cashChart(L){const v=[START,...L.map(x=>x.gotowka)],mn=Math.min(0,...v),mx=Math.max(START,...v),W_=320,H_=120,pad=8,
  X=i=>pad+i*(W_-2*pad)/(v.length-1||1),Y=y=>H_-pad-(y-mn)/((mx-mn)||1)*(H_-2*pad);
 const pts=v.map((y,i)=>[X(i),Y(y)]);
 return `<svg viewBox="0 0 ${W_} ${H_+16}" style="width:100%;height:auto" role="img" aria-label="Wykres gotówki"><line x1="${pad}" y1="${Y(0)}" x2="${W_-pad}" y2="${Y(0)}" stroke="var(--muted)" stroke-dasharray="3 3"/><line x1="${pad}" y1="${Y(START)}" x2="${W_-pad}" y2="${Y(START)}" stroke="var(--line)"/><polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-linejoin="round"/>${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="${v[i]>=START?'var(--good)':'var(--bad)'}"/><text x="${p[0]}" y="${H_+12}" text-anchor="middle" font-size="10" fill="var(--muted)">${i}</text>`).join('')}</svg><p class="small muted">Linia pozioma: stan początkowy (${START} tys. zł). Przerywana: zero. Cyfry to numery sezonów.</p>`}
function end(){
 const L=S.log;
 const hhi=L.map(x=>{const s=x.ha_psz+x.ha_rze+x.ha_zie||1;return((x.ha_psz/s)**2+(x.ha_rze/s)**2+(x.ha_zie/s)**2)}).reduce((a,b)=>a+b,0)/L.length;
 const dev=L.map(x=>(Math.abs(x.naw_psz-REC.pszenica)*x.ha_psz+Math.abs(x.naw_rze-REC.rzepak)*x.ha_rze+Math.abs(x.naw_zie-REC.ziemniaki)*x.ha_zie)/((x.ha_psz+x.ha_rze+x.ha_zie)||1)).reduce((a,b)=>a+b,0)/L.length;
 const meta={kod:S.id,wariant:S.info,wersja:GAME_VERSION,loteria:S.lot===null?null:S.lot+1,quiz:S.quiz.join(''),upadek:S.over?1:0,gotowka_koncowa:+S.cash.toFixed(2),hhi:+hhi.toFixed(3),sr_odchylenie_nawozu:+dev.toFixed(2),sezony_ubezp:L.filter(x=>x.ubezp).length};
 if(!S.endSent){send({typ:'koniec',...meta});S.endSent=true;save()}
 const hdr=Object.keys(L[0]);
 const csv=[hdr.join(','),...L.map(x=>hdr.map(h=>x[h]).join(','))].join('\n');
 app.innerHTML=`<div class="scene">${sceneSVG(S.cash>=START?'G':'N')}<div class="cap"><div><div class="label" style="color:#fff;opacity:.85">Koniec gry</div><b>Gotówka końcowa: ${f1(S.cash)} tys. zł</b></div></div></div>
 <p class="muted">${S.over?'Gospodarstwo upadło.':'Rozegrałeś wszystkie sezony.'} Start: ${START} tys. zł.</p>
 <div class="panel"><div class="label">Twoje decyzje w skrócie</div>
  <div class="kv"><span>Średnia różnorodność upraw (1 = jedna uprawa, 0,33 = równo trzy)</span><span>${f2(hhi)}</span></div>
  <div class="kv"><span>Średnie odchylenie nawozu od zalecanego (poziomy)</span><span>${f1(dev)}</span></div>
  <div class="kv"><span>Sezony z ubezpieczeniem</span><span>${meta.sezony_ubezp}</span></div></div>
 <div class="panel"><div class="label">Twoja gotówka w kolejnych sezonach (tys. zł)</div>${cashChart(L)}</div>
 <div class="panel scroll"><table><tr><th>Sezon</th><th>Pogoda</th><th>Psz./Rze./Zie. (ha)</th><th>Nawóz</th><th>Wynik</th><th>Gotówka</th></tr>
  ${L.map(x=>`<tr><td>${x.sezon}</td><td>${WNAME[x.pogoda]}</td><td class="num">${x.ha_psz}/${x.ha_rze}/${x.ha_zie}</td><td class="num">${x.naw_psz}/${x.naw_rze}/${x.naw_zie}</td><td class="num ${x.wynik>=0?'pos':'neg'}">${sgn(x.wynik)}</td><td class="num">${f1(x.gotowka)}</td></tr>`).join('')}</table></div>
 <div class="panel"><h3>Dane do badania</h3><p class="small muted">${ENDPOINT?'Wyniki zostały wysłane automatycznie. Jeśli prowadząca badanie ich nie widzi, skopiuj poniższy tekst i wklej go w formularzu.':'Skopiuj poniższy tekst i wklej go w formularzu przekazanym przez prowadzącą badanie.'} Zawiera tylko kod uczestnika i decyzje w grze.</p>
  <textarea id="out" readonly>${csv}\n#${JSON.stringify(meta)}</textarea>
  <div class="row"><button id="cp">Skopiuj wyniki</button><span id="cpm" class="small"></span><button class="ghost" id="rs">Zagraj ponownie (tryb pokazowy)</button></div></div>`;
 $('#cp').onclick=()=>{const t=$('#out');t.select();let ok=false;try{navigator.clipboard.writeText(t.value).then(()=>{$('#cpm').textContent='Skopiowano.'},()=>{$('#cpm').textContent='Zaznacz tekst i skopiuj ręcznie.'});ok=true}catch(e){}if(!ok)$('#cpm').textContent='Zaznacz tekst i skopiuj ręcznie.'};
 $('#rs').onclick=()=>{clearSave();S=fresh();render()};}
function render(){({intro,lottery,rules,season,result,end})[S.screen]();window.scrollTo(0,0);save()}
if(location.hash!=='#demo'){const o=loadSaved();if(o){S=Object.assign(fresh(),o);S.t0=Date.now()}}
render();
</script>
